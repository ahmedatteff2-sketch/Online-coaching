name: platform-ci

on:
  push:
    branches: ['**']
    paths:
      - 'platform/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'platform/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/package-lock.json

      - name: Install
        run: npm ci

      - name: Prisma generate
        run: npm --workspace apps/api run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
